<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>অর্ডার সম্পাদনা — FlamboyAI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f3f4f6; color: #111; min-height: 100vh; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
    .logo { text-align: center; font-size: 22px; font-weight: 800; color: #14161C; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #6b7280; font-size: 13px; margin-bottom: 24px; }
    .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 12px #0001; margin-bottom: 16px; }
    .card h2 { font-size: 15px; font-weight: 700; color: #374151; margin-bottom: 14px; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
    label { display: block; font-size: 12px; color: #6b7280; font-weight: 600; margin-bottom: 4px; margin-top: 12px; }
    label:first-of-type { margin-top: 0; }
    input, textarea { width: 100%; border: 1.5px solid #d1d5db; border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; transition: border 0.2s; }
    input:focus, textarea:focus { border-color: #14161C; }
    textarea { resize: vertical; min-height: 72px; }
    .item-row { display: flex; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f3f4f6; }
    .item-row:last-child { border-bottom: none; }
    .item-code { font-weight: 700; font-size: 14px; flex: 1; }
    .item-price { font-size: 13px; color: #6b7280; }
    .qty-ctrl { display: flex; align-items: center; gap: 6px; }
    .qty-btn { width: 28px; height: 28px; border-radius: 6px; border: 1.5px solid #d1d5db; background: #f9fafb; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .qty-btn:hover { background: #EDEFF2; border-color: #14161C; }
    .qty-val { min-width: 24px; text-align: center; font-weight: 700; }
    .del-btn { color: #ef4444; cursor: pointer; font-size: 18px; padding: 2px 6px; border-radius: 6px; border: none; background: none; }
    .del-btn:hover { background: #fee2e2; }
    .total-row { display: flex; justify-content: space-between; font-weight: 700; font-size: 16px; color: #14161C; padding-top: 10px; }
    .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: #14161C; color: #fff; }
    .btn-primary:hover { background: #0A0B10; }
    .btn-primary:disabled { background: #C7CCD3; cursor: not-allowed; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .badge-received { background: #fef3c7; color: #92400e; }
    .badge-confirmed { background: #d1fae5; color: #065f46; }
    .badge-packed { background: #dbeafe; color: #1e40af; }
    .locked-msg { background: #fef2f2; border: 1.5px solid #fca5a5; border-radius: 10px; padding: 14px; color: #991b1b; font-size: 14px; text-align: center; margin-bottom: 16px; }
    .success-box { background: #d1fae5; border: 1.5px solid #6ee7b7; border-radius: 10px; padding: 14px; color: #065f46; font-size: 14px; text-align: center; display: none; }
    .err-box { background: #fef2f2; border: 1.5px solid #fca5a5; border-radius: 10px; padding: 14px; color: #991b1b; font-size: 14px; text-align: center; display: none; }
    .loader { text-align: center; padding: 40px; color: #6b7280; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #14161C; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo">FlamboyAI</div>
  <div class="subtitle">আপনার অর্ডারের তথ্য সম্পাদনা করুন</div>

  <div id="loader" class="loader">
    <div class="spinner"></div>
    লোড হচ্ছে...
  </div>

  <div id="main" style="display:none">
    <div class="card" id="order-header">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:13px;color:#6b7280">অর্ডার নম্বর</div>
          <div style="font-size:20px;font-weight:800;color:#14161C" id="order-id-label"></div>
        </div>
        <span class="status-badge" id="status-badge"></span>
      </div>
    </div>

    <div id="locked-banner" class="locked-msg" style="display:none">
      🔒 এই অর্ডারটি আর সম্পাদনা করা যাবে না।
    </div>

    <div id="success-msg" class="success-box">✅ আপনার তথ্য সফলভাবে আপডেট হয়েছে!</div>
    <div id="err-msg" class="err-box"></div>

    <div id="form-section">
      <div class="card">
        <h2>👤 ব্যক্তিগত তথ্য</h2>
        <label>নাম</label>
        <input type="text" id="f-name" placeholder="আপনার নাম" />
        <label>ফোন নম্বর</label>
        <input type="tel" id="f-phone" placeholder="01XXXXXXXXX" />
        <label>ঠিকানা</label>
        <textarea id="f-address" placeholder="পূর্ণ ঠিকানা লিখুন"></textarea>
      </div>

      <div class="card">
        <h2>🛍️ পণ্য তালিকা</h2>
        <div id="items-list"></div>
        <div class="total-row">
          <span>মোট</span>
          <span id="total-label">৳0</span>
        </div>
      </div>

      <div id="success-msg2" class="success-box" style="margin-bottom:8px"></div>
      <button class="btn btn-primary" id="save-btn" onclick="saveOrder()">✅ তথ্য সংরক্ষণ করুন</button>
    </div>
  </div>
</div>

<script>
  const API = 'https://api.flamboyai.com';
  let token = '';
  let orderData = null;

  function getToken() {
    const p = new URLSearchParams(location.search);
    return p.get('token') || '';
  }

  function statusLabel(s) {
    const map = { RECEIVED: 'প্রাপ্ত', CONFIRMED: 'কনফার্ম', PACKED: 'প্যাক', SHIPPED: 'পাঠানো হয়েছে', DELIVERED: 'ডেলিভারি', CANCELLED: 'বাতিল' };
    return map[s] || s;
  }
  function statusClass(s) {
    if (s === 'RECEIVED') return 'badge-received';
    if (s === 'CONFIRMED') return 'badge-confirmed';
    if (s === 'PACKED') return 'badge-packed';
    return 'badge-received';
  }

  function calcTotal() {
    if (!orderData) return 0;
    return orderData.items.reduce((s, i) => s + i.unitPrice * i.qty, 0);
  }

  function renderItems() {
    const list = document.getElementById('items-list');
    list.innerHTML = '';
    orderData.items.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'item-row';
      div.innerHTML = `
        <div style="flex:1">
          <div class="item-code">${item.productCode}</div>
          <div class="item-price">৳${item.unitPrice} × ${item.qty} = ৳${item.unitPrice * item.qty}</div>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
          <span class="qty-val">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
        </div>
        <button class="del-btn" onclick="removeItem(${idx})">✕</button>
      `;
      list.appendChild(div);
    });
    document.getElementById('total-label').textContent = '৳' + calcTotal();
  }

  function changeQty(idx, delta) {
    orderData.items[idx].qty = Math.max(1, orderData.items[idx].qty + delta);
    renderItems();
  }

  function removeItem(idx) {
    if (orderData.items.length <= 1) { showErr('কমপক্ষে একটি পণ্য থাকতে হবে।'); return; }
    orderData.items.splice(idx, 1);
    renderItems();
  }

  function showErr(msg) {
    const el = document.getElementById('err-msg');
    el.textContent = msg; el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
  }

  async function loadOrder() {
    token = getToken();
    if (!token) { document.getElementById('loader').textContent = '❌ লিংক সঠিক নয়।'; return; }
    try {
      const res = await fetch(`${API}/public/order/${token}`);
      if (!res.ok) throw new Error('Not found');
      orderData = await res.json();
      document.getElementById('loader').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      document.getElementById('order-id-label').textContent = '#' + orderData.id;
      const badge = document.getElementById('status-badge');
      badge.textContent = statusLabel(orderData.status);
      badge.className = 'status-badge ' + statusClass(orderData.status);
      document.getElementById('f-name').value = orderData.customerName || '';
      document.getElementById('f-phone').value = orderData.phone || '';
      document.getElementById('f-address').value = orderData.address || '';
      if (orderData.locked) {
        document.getElementById('locked-banner').style.display = 'block';
        document.getElementById('form-section').style.display = 'none';
      } else {
        renderItems();
      }
    } catch (e) {
      document.getElementById('loader').textContent = '❌ অর্ডার পাওয়া যায়নি।';
    }
  }

  async function saveOrder() {
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'সংরক্ষণ হচ্ছে...';
    try {
      const body = {
        customerName: document.getElementById('f-name').value.trim(),
        phone: document.getElementById('f-phone').value.trim(),
        address: document.getElementById('f-address').value.trim(),
        items: orderData.items,
      };
      const res = await fetch(`${API}/public/order/${token}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) { const e = await res.json(); throw new Error(e.message || 'Error'); }
      const succ = document.getElementById('success-msg');
      succ.style.display = 'block';
      setTimeout(() => succ.style.display = 'none', 4000);
    } catch (e) {
      showErr('❌ সমস্যা হয়েছে: ' + e.message);
    } finally {
      btn.disabled = false; btn.textContent = '✅ তথ্য সংরক্ষণ করুন';
    }
  }

  loadOrder();
</script>
</body>
</html>
